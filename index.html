<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NoviMundi Tiers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
</head>
<body>
<style>
/* Тёмный зал рейтинга: строки-плиты, у первых трёх - отлив металла, тиры - цветные плашки под значками китов */
:root {
  color-scheme: dark;
  --bg: #0c0e13;
  --panel: #141821;
  --panel-2: #1b2030;
  --line: #262d3e;
  --fg: #e9ecf3;
  --muted: #8a93a8;
  --accent: #ff9f63;
  --gold: #f2c94c;
  --silver: #c9d3df;
  --bronze: #cf8a52;
  --display: "Press Start 2P", "Onest", system-ui, sans-serif;
  --body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
  --radius: 12px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 0 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* шапка: логотип, киты, поиск - одной строкой */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 20px; padding-block: 10px; }
.logo { font: 400 18px/1.3 var(--display); letter-spacing: .02em; white-space: nowrap; }
.logo b { color: var(--accent); font-weight: 400; }
.search { display: block; max-width: 440px; margin: 22px auto 0; }
.search input { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: var(--fg); font: 500 17px var(--body); padding: 12px 16px; }
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* вкладки китов: значок над названием, все сразу, без прокрутки */
.tabs { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 70px; padding: 6px 8px 6px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: 600 13px/1.1 var(--body); white-space: nowrap; cursor: pointer; }
.tab:hover { color: var(--fg); background: var(--panel-2); }
.tab[aria-selected="true"] { color: var(--fg); background: var(--panel-2); box-shadow: inset 0 -3px 0 var(--accent); }
.tab:focus-visible { outline: 2px solid var(--accent); }
.tab img, .tab svg { width: 38px; height: 38px; }
.tab svg { padding: 5px; color: var(--accent); }
.tab img, .kit-ico img { image-rendering: auto; object-fit: contain; }

/* заголовок */
.hero { text-align: center; padding-block: 44px 28px; }
.hero h1 { margin: 0; font: 400 clamp(28px, 5.5vw, 52px)/1.2 var(--display); letter-spacing: .02em; text-wrap: balance; }
.hero p { margin: 14px auto 0; color: var(--muted); max-width: 56ch; font-size: 18px; }
.sample { margin: 16px auto 0; display: inline-flex; gap: 8px; align-items: center; padding: 6px 14px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font: 600 14px var(--body); letter-spacing: .02em; }

/* строки рейтинга */
.list { display: grid; gap: 10px; }
.row { position: relative; display: grid; grid-template-columns: 64px 80px minmax(0, 1fr) auto; align-items: center; gap: 18px; padding: 14px 20px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; overflow: hidden; }
.row:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row.p1 { background: linear-gradient(90deg, color-mix(in srgb, var(--gold) 34%, var(--panel)) 0%, var(--panel) 62%); border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); }
.row.p2 { background: linear-gradient(90deg, color-mix(in srgb, var(--silver) 26%, var(--panel)) 0%, var(--panel) 62%); border-color: color-mix(in srgb, var(--silver) 35%, var(--line)); }
.row.p3 { background: linear-gradient(90deg, color-mix(in srgb, var(--bronze) 30%, var(--panel)) 0%, var(--panel) 62%); border-color: color-mix(in srgb, var(--bronze) 40%, var(--line)); }
.place { font: 400 26px/1 var(--display); text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.p1 .place { color: var(--gold); } .p2 .place { color: var(--silver); } .p3 .place { color: var(--bronze); }
/* скин по пояс, низом садится на край строки */
.skin { width: 80px; height: 80px; align-self: end; margin-block: -10px -15px; }
.skin img { display: block; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,.45)); }
.who { min-width: 0; }
.name { font: 700 22px/1.2 var(--body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { margin-top: 4px; color: var(--muted); font-size: 15px; display: flex; gap: 12px; flex-wrap: wrap; }
.sub .title { color: var(--accent); font-weight: 600; }
.num { font: 600 15px var(--mono); color: var(--fg); }

/* тиры строкой: значок кита и плашка тира под ним */
.tiers { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.chip { width: 58px; display: grid; justify-items: center; gap: 4px; }
.kit-ico { width: 50px; height: 50px; border-radius: 10px; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--line); }
.kit-ico img { width: 44px; height: 44px; }
.badge { min-width: 52px; padding: 2px 5px; border-radius: 5px; font: 700 13px/1.5 var(--mono); text-align: center; color: #0c0e13; }
.badge.none { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
.chip.empty .kit-ico { opacity: .5; }

/* вкладка кита: тир крупно, ELO и счёт */
.row.kit { grid-template-columns: 64px 80px minmax(0, 1fr) auto auto; }
.big-tier { padding: 6px 14px; border-radius: 8px; font: 700 20px var(--mono); color: #0c0e13; }
.stats { display: grid; grid-template-columns: repeat(3, auto); gap: 2px 20px; text-align: right; }
.stats span { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.stats .num { font-size: 18px; }

.empty-state { padding: 48px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }
.foot { margin-top: 32px; color: var(--muted); font-size: 14px; text-align: center; }

/* карточка игрока */
dialog { width: min(700px, calc(100% - 32px)); background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 16px; padding: 0; }
dialog::backdrop { background: rgba(5, 7, 10, .7); }
.card-h { display: flex; gap: 20px; align-items: center; padding: 22px; border-bottom: 1px solid var(--line); }
.card-h .skin { width: 112px; height: 112px; margin: 0; }
.card-h h2 { margin: 0; font: 700 28px var(--body); }
.card-b { padding: 20px 22px 24px; display: grid; gap: 18px; }
.totals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tot { background: var(--panel-2); border-radius: 10px; padding: 12px 14px; }
.tot b { display: block; font: 700 24px var(--mono); }
.tot span { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.kit-table { width: 100%; border-collapse: collapse; font-size: 17px; }
.kit-table th { text-align: left; color: var(--muted); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; padding: 0 8px 8px; }
.kit-table td { padding: 8px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.kit-name { display: flex; align-items: center; gap: 10px; }
.kit-name img { width: 36px; height: 36px; object-fit: contain; }
.close { margin-left: auto; align-self: flex-start; background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 10px; padding: 6px 14px; font: 600 15px var(--body); cursor: pointer; }
.close:focus-visible { outline: 2px solid var(--accent); }

/* уже экран - киты строкой под логотипом, значки тиров - строкой под ником */
@media (max-width: 1180px) {
  .top-in { flex-direction: column; align-items: center; gap: 8px; }
  .tabs { justify-content: center; }
}
@media (max-width: 1120px) {
  .tiers { grid-column: 1 / -1; justify-content: flex-start; padding-left: 82px; }
}
@media (max-width: 720px) {
  .top { position: static; }
  .logo { font-size: 15px; }
  .tab { min-width: 62px; padding-inline: 4px; font-size: 12px; }
  .tab img, .tab svg { width: 32px; height: 32px; }
  .row, .row.kit { grid-template-columns: 40px 60px minmax(0, 1fr); gap: 12px; padding: 12px 14px; }
  .skin { width: 60px; height: 60px; margin-block: -6px -12px; }
  .place { font-size: 18px; }
  .name { font-size: 19px; }
  .tiers, .row.kit .stats, .row.kit .big-tier { grid-column: 1 / -1; justify-content: flex-start; justify-self: start; padding-left: 0; }
  .totals { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: no-preference) {
  .row { transition: border-color .15s, transform .15s; }
  .row:hover { transform: translateY(-1px); }
}
</style>

<script>
(function () {
  "use strict";

  /*
   * Данные - data.json, его выгружает плагин DuelPractice (WebExport.kt).
   * Если файла нет рядом (превью), берётся window.DP_SAMPLE с пометкой «пример».
   */
  var DATA = null;
  var tab = "overall";

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  // звание по сумме очков - как «Combat Master» у тестеров
  function rankTitle(points) {
    if (points >= 200) return "Легенда";
    if (points >= 120) return "Мастер боя";
    if (points >= 60) return "Ветеран";
    if (points >= 20) return "Боец";
    if (points > 0) return "Новичок";
    return "Без тира";
  }

  function tierOf(key) { return (DATA.tiers || []).find(function (t) { return t.key === key; }); }
  function tierPoints(key) { var t = tierOf(key); return t ? t.points : 0; }

  // значок кита: картинка из icons/ (её кладёт MakeSite.py) или встроенная в превью
  function iconSrc(kit) {
    var icons = window.DP_ICONS || {};
    return icons[kit.icon] || ("icons/" + kit.icon + ".png");
  }

  // скин по нику с лицензии (Visage - свежий скин с Mojang, у mc-heads бывает старый кэш);
  // в превью - картинкой внутри страницы
  function skinSrc(p) {
    if (p.body) return p.body;
    return "https://visage.surgeplay.com/bust/256/" + encodeURIComponent(p.name);
  }
  function skin(p) { return '<div class="skin"><img alt="" src="' + esc(skinSrc(p)) + '"></div>'; }

  function badge(tierKey, cls) {
    if (!tierKey) return '<span class="badge none">—</span>';
    var t = tierOf(tierKey);
    var color = t ? t.color : "#8a93a8";
    return '<span class="' + (cls || "badge") + '" style="background:' + esc(color) + '">' + esc(tierKey) + "</span>";
  }

  function chips(p) {
    return DATA.kits.map(function (k) {
      var key = (p.tiers || {})[k.key];
      return '<div class="chip' + (key ? "" : " empty") + '" title="' + esc(k.name) + (key ? ": " + esc(key) : "") + '">' +
        '<div class="kit-ico"><img alt="" src="' + esc(iconSrc(k)) + '"></div>' + badge(key) + "</div>";
    }).join("");
  }

  function matches(p) {
    var q = $("q").value.trim().toLowerCase();
    return !q || p.name.toLowerCase().indexOf(q) !== -1;
  }

  function renderTabs() {
    var html = '<button class="tab" role="tab" data-tab="overall">' +
      '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 2h12v2h4v4a5 5 0 0 1-4.6 5A6 6 0 0 1 13 16.9V19h4v3H7v-3h4v-2.1A6 6 0 0 1 6.6 13 5 5 0 0 1 2 8V4h4zm0 4H4v2a3 3 0 0 0 2 2.8zm12 0v4.8A3 3 0 0 0 20 8V6z"/></svg>Общий</button>';
    DATA.kits.forEach(function (k) {
      html += '<button class="tab" role="tab" data-tab="' + esc(k.key) + '"><img alt="" src="' + esc(iconSrc(k)) + '">' + esc(k.name.replace(/^Kit\s+/i, "")) + "</button>";
    });
    $("tabs").innerHTML = html;
    Array.prototype.forEach.call($("tabs").children, function (b) {
      b.setAttribute("aria-selected", String(b.dataset.tab === tab));
      b.addEventListener("click", function () { setTab(b.dataset.tab); });
    });
  }

  function setTab(t) {
    tab = t;
    Array.prototype.forEach.call($("tabs").children, function (b) { b.setAttribute("aria-selected", String(b.dataset.tab === tab)); });
    try { localStorage.setItem("dp-tab", t); } catch (e) {}
    if (location.hash !== "#" + t) history.replaceState(null, "", "#" + t);
    render();
  }

  function render() {
    var players = DATA.players.slice();
    var out = [];
    if (tab === "overall") {
      players = players.filter(function (p) { return p.points > 0; });
      players.sort(function (a, b) { return b.points - a.points || (b.wins || 0) - (a.wins || 0) || a.name.localeCompare(b.name); });
      players.forEach(function (p, i) {
        if (!matches(p)) return;
        out.push(
          '<div class="row' + (i < 3 ? " p" + (i + 1) : "") + '" tabindex="0" data-name="' + esc(p.name) + '">' +
          '<div class="place">' + (i + 1) + "</div>" +
          skin(p) +
          '<div class="who"><div class="name">' + esc(p.name) + '</div><div class="sub"><span class="title">' + rankTitle(p.points) + '</span><span class="num">' + p.points + " очк.</span></div></div>" +
          '<div class="tiers">' + chips(p) + "</div></div>"
        );
      });
      $("lead").textContent = "Рейтинг игроков по сумме очков тиров во всех китах. Тиры выдают тестеры по дуэлям на сервере.";
    } else {
      var kit = DATA.kits.find(function (k) { return k.key === tab; });
      players = players.filter(function (p) { return (p.tiers || {})[tab]; });
      players.sort(function (a, b) {
        return tierPoints(b.tiers[tab]) - tierPoints(a.tiers[tab]) || ((b.elo || {})[tab] || 0) - ((a.elo || {})[tab] || 0);
      });
      players.forEach(function (p, i) {
        if (!matches(p)) return;
        var s = (p.kits || {})[tab] || {};
        var games = (s.wins || 0) + (s.losses || 0);
        var wr = games ? Math.round(100 * (s.wins || 0) / games) + "%" : "—";
        out.push(
          '<div class="row kit' + (i < 3 ? " p" + (i + 1) : "") + '" tabindex="0" data-name="' + esc(p.name) + '">' +
          '<div class="place">' + (i + 1) + "</div>" +
          skin(p) +
          '<div class="who"><div class="name">' + esc(p.name) + '</div><div class="sub"><span class="title">' + esc(kit ? kit.name : tab) + "</span></div></div>" +
          badge(p.tiers[tab], "big-tier") +
          '<div class="stats"><span>ELO</span><span>Победы</span><span>Винрейт</span>' +
          '<b class="num">' + ((p.elo || {})[tab] || "—") + '</b><b class="num">' + (s.wins || 0) + "/" + (s.losses || 0) + '</b><b class="num">' + wr + "</b></div></div>"
        );
      });
      $("lead").textContent = (kit ? kit.name : tab) + ": тир на ките, потом ELO рейтинговых дуэлей.";
    }
    $("list").innerHTML = out.length ? out.join("") :
      '<div class="empty-state">' + ($("q").value.trim() ? "Никого с таким ником." : "Тиров пока нет. Тестер выдаёт их командой /tier set на сервере.") + "</div>";
    Array.prototype.forEach.call($("list").querySelectorAll(".row"), function (r) {
      r.addEventListener("click", function () { openCard(r.dataset.name); });
      r.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openCard(r.dataset.name); } });
    });
  }

  function openCard(name) {
    var p = DATA.players.find(function (x) { return x.name === name; });
    if (!p) return;
    var kd = (p.deaths || 0) ? ((p.kills || 0) / p.deaths).toFixed(2) : String(p.kills || 0);
    var rows = DATA.kits.map(function (k) {
      var s = (p.kits || {})[k.key] || {};
      return "<tr><td><span class=\"kit-name\"><img alt=\"\" src=\"" + esc(iconSrc(k)) + "\">" + esc(k.name) + "</span></td><td>" + badge((p.tiers || {})[k.key]) +
        '</td><td class="num">' + ((p.elo || {})[k.key] || "—") + '</td><td class="num">' + (s.wins || 0) + "/" + (s.losses || 0) + "</td></tr>";
    }).join("");
    $("card").innerHTML =
      '<div class="card-h">' + skin(p) + '<div><h2 id="card-name">' + esc(p.name) + '</h2><div class="sub"><span class="title">' + rankTitle(p.points) + '</span><span class="num">' + p.points + ' очк.</span></div></div><button class="close" id="close">Закрыть</button></div>' +
      '<div class="card-b"><div class="totals">' +
      '<div class="tot"><b>' + (p.wins || 0) + "</b><span>Победы</span></div>" +
      '<div class="tot"><b>' + (p.losses || 0) + "</b><span>Поражения</span></div>" +
      '<div class="tot"><b>' + kd + "</b><span>У/С</span></div>" +
      '<div class="tot"><b>' + (p.bestStreak || 0) + "</b><span>Серия</span></div></div>" +
      '<div style="overflow-x:auto"><table class="kit-table"><thead><tr><th>Кит</th><th>Тир</th><th>ELO</th><th>Победы</th></tr></thead><tbody>' + rows + "</tbody></table></div></div>";
    $("close").addEventListener("click", function () { $("card").close(); });
    $("card").showModal();
  }

  function start(data, sample) {
    DATA = data;
    DATA.kits = DATA.kits || [];
    DATA.players = DATA.players || [];
    $("sample").hidden = !sample;
    var wanted = (location.hash || "").slice(1);
    try { wanted = wanted || localStorage.getItem("dp-tab") || ""; } catch (e) {}
    if (wanted === "overall" || DATA.kits.some(function (k) { return k.key === wanted; })) tab = wanted;
    renderTabs();
    render();
    var when = DATA.generated ? new Date(DATA.generated) : null;
    $("foot").textContent = (DATA.server || "NoviMundi") + " · игроков в рейтинге: " + DATA.players.filter(function (p) { return p.points > 0; }).length +
      (when && !isNaN(when) ? " · обновлено " + when.toLocaleString("ru-RU") : "");
  }

  // значок или скин не загрузился (у щита нет плоской текстуры, у ника нет скина) -
  // место остаётся пустым, без значка битой картинки
  document.addEventListener("error", function (e) {
    if (e.target && e.target.tagName === "IMG") e.target.style.visibility = "hidden";
  }, true);
  $("q").addEventListener("input", render);
  $("card").addEventListener("click", function (e) { if (e.target === $("card")) $("card").close(); });

  if (window.DP_SAMPLE) {
    start(window.DP_SAMPLE, true);
  } else if (window.DP_DATA) {
    start(window.DP_DATA, false);
  } else {
    fetch("data.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { start(d, false); })
      .catch(function () {
        $("list").innerHTML = '<div class="empty-state">Не нашёл data.json рядом со страницей. Его выгружает плагин в plugins/DuelPractice/web/data.json - положите файл рядом с index.html.</div>';
      });
  }
})();
</script>

</body>
</html>
