<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NoviMundi Tiers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
</head>
<body>
<style>
/* Тёмный зал рейтинга: игроки во весь рост на плитах, у первых трёх - живой отлив, киты - цветные плитки */
:root {
  color-scheme: dark;
  --bg: #0b0d12;
  --panel: #15181f;
  --panel-2: #1c2029;
  --line: #262b37;
  --fg: #eef0f5;
  --muted: #8b93a6;
  --accent: #ff9f63;
  --accent-2: #ffd36b;
  --gold: #f0b857;
  --silver: #a9b1b9;
  --bronze: #d59161;
  --display: "Unbounded", "Onest", system-ui, sans-serif;
  /* тень букв, как у текста в игре: тот же цвет, сдвиг вниз-вправо */
  --mc-shadow: .08em .08em 0 rgba(0, 0, 0, .55);
  --body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
  --radius: 16px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 17px/1.5 var(--body); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

/* фон: тёплые и холодные пятна света медленно плывут, поверх - едва видная сетка блоков */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bg i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(90px); opacity: .22; }
.bg i:nth-child(1) { background: #ff7a3d; left: -20vmax; top: -25vmax; animation: drift1 26s ease-in-out infinite alternate; }
.bg i:nth-child(2) { background: #6b5cff; right: -25vmax; top: 10vh; opacity: .16; animation: drift2 32s ease-in-out infinite alternate; }
.bg i:nth-child(3) { background: #1fb5a8; left: 20vw; bottom: -35vmax; opacity: .12; animation: drift1 38s ease-in-out infinite alternate-reverse; }
.bg::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 75%); animation: grid 40s linear infinite; }
@keyframes drift1 { to { transform: translate3d(14vw, 12vh, 0) scale(1.15); } }
@keyframes drift2 { to { transform: translate3d(-12vw, 18vh, 0) scale(.9); } }
@keyframes grid { to { background-position: 0 48px, 48px 0; } }

.wrap { max-width: 1320px; margin: 0 auto; padding-block: 0 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* переливающийся текст: логотип и заголовок */
.shine-text { background: linear-gradient(90deg, var(--fg) 0%, var(--fg) 35%, var(--accent-2) 45%, var(--accent) 52%, var(--fg) 62%, var(--fg) 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: flow 6s linear infinite; }
@keyframes flow { from { background-position: 100% 0; } to { background-position: -150% 0; } }

/* шапка: логотип слева, киты по середине */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding-top: 10px; }
.top-in { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 20px; padding: 8px 18px;
  border: 1px solid var(--line); border-radius: 20px; background: color-mix(in srgb, var(--panel) 86%, transparent); backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.logo { justify-self: start; position: relative; display: inline-flex; align-items: center; gap: 12px; white-space: nowrap; }
/* название - текст как в Minecraft: буквы точками, у каждой тень на точку вниз-вправо
   цветом вчетверо темнее; «Tiers!» - жёлтая надпись наискосок, как на главном экране игры */
.mc { display: block; height: 36px; image-rendering: pixelated; }
.mc svg { display: block; height: 100%; width: auto; }
.splash { position: absolute; left: calc(100% + 4px); top: -8px; height: 22px; transform-origin: 30% 60%; animation: splash .55s ease-in-out infinite alternate; pointer-events: none; }
.splash svg { display: block; height: 100%; width: auto; }
@keyframes splash { from { transform: rotate(-16deg) scale(.9); } to { transform: rotate(-16deg) scale(1.04); } }
/* знак: сам логотип без фона, по нему бежит блик */
.mark { width: 48px; height: 48px; flex: none; background: linear-gradient(115deg, #ff6a00 0%, #ff6a00 42%, #ffffff 47%, #ffffff 51%, #ff6a00 56%, #ff6a00 100%);
  background-size: 400% 100%; background-position: 0 0; -webkit-mask: var(--mark) center / contain no-repeat; mask: var(--mark) center / contain no-repeat;
  animation: markin 1.1s cubic-bezier(.5, 0, .2, 1) both, markflow 5s 1.4s linear infinite; transition: transform .25s; }
.logo:hover .mark { transform: rotate(-8deg) scale(1.08); }
/* появление: знак прорисовывается слева-сверху вправо-вниз, у кромки - белая полоса */
@keyframes markin {
  from { clip-path: polygon(0 0, 0 0, -40% 100%, -40% 100%); background-position: 100% 0; }
  to { clip-path: polygon(0 0, 140% 0, 100% 100%, -40% 100%); background-position: 0 0; }
}
/* потом белая полоса изредка пробегает по знаку */
@keyframes markflow { 0% { background-position: 100% 0; } 22% { background-position: 0 0; } 100% { background-position: 0 0; } }


/* вкладки китов: значок над названием, все сразу, без прокрутки */
.tabs { grid-column: 2; min-width: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.tab { position: relative; display: grid; place-items: center; width: 58px; height: 54px; padding: 0; border: 0; border-radius: 14px; background: transparent; color: var(--muted); cursor: pointer; transition: background-color .2s, transform .2s; }
.tab:hover { background: var(--panel-2); transform: translateY(-2px); }
.tab:hover > img, .tab:hover > svg { animation: wiggle .55s ease-in-out; filter: drop-shadow(0 4px 10px color-mix(in srgb, var(--accent) 55%, transparent)); transform: scale(1.18); }
.tab .tip { position: absolute; top: calc(100% + 10px); left: 50%; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px;
  background: color-mix(in srgb, var(--panel) 96%, black); color: var(--fg); font: 700 14px var(--body); white-space: nowrap; pointer-events: none; z-index: 10;
  opacity: 0; transform: translate(-50%, -6px) scale(.96); transition: opacity .18s, transform .18s; box-shadow: 0 10px 24px rgba(0,0,0,.45); }
.tab .tip img, .tab .tip svg { width: 20px; height: 20px; animation: none !important; transform: none !important; filter: none !important; }
.tab:hover .tip, .tab:focus-visible .tip { opacity: 1; transform: translate(-50%, 0) scale(1); }
@keyframes wiggle { 0% { transform: scale(1) rotate(0); } 30% { transform: scale(1.22) rotate(-12deg); } 60% { transform: scale(1.18) rotate(8deg); } 100% { transform: scale(1.18) rotate(0); } }
.tab[aria-selected="true"] { color: var(--fg); background: var(--panel-2); box-shadow: inset 0 -3px 0 var(--accent); }
.tab:focus-visible { outline: 2px solid var(--accent); }
.tab img, .tab svg { width: 42px; height: 42px; transition: transform .2s, filter .2s; }
.tab svg { padding: 2px; }
.tab img, .chip img, .tp img { image-rendering: auto; object-fit: contain; }

/* главная (как у CISTiers): баннер слева, справа первое место и сообщества, ниже киты */
.logo { color: var(--fg); text-decoration: none; cursor: pointer; }
.home { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; padding-top: 28px; }
.banner { position: relative; overflow: hidden; min-height: 430px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); border-radius: 20px; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 85% 100%, color-mix(in srgb, var(--accent) 35%, transparent), transparent 60%), radial-gradient(80% 70% at 0% 0%, #3a1d14, transparent 70%), linear-gradient(135deg, #1a1210, #120e17 60%, #0d1018); }
.banner::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 14px); pointer-events: none; }
.banner-text { position: relative; z-index: 1; padding: 30px 32px; display: flex; flex-direction: column; gap: 14px; }
.kicker { color: var(--accent); font: 700 13px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; }
.banner-title { margin: 0; font: 900 clamp(34px, 5vw, 60px)/1 var(--display); text-transform: uppercase; letter-spacing: -.01em; }
.banner-title b { color: var(--accent); font-weight: 900; }
.banner p { margin: 0; color: color-mix(in srgb, var(--fg) 72%, transparent); max-width: 44ch; }
.stats { display: flex; gap: 26px; flex-wrap: wrap; }
.stats b { display: block; font: 800 30px/1.1 var(--display); }
.stats span { color: var(--muted); font-size: 13px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 12px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel-2) 80%, transparent); color: var(--fg); font: 700 15px var(--body); text-decoration: none; cursor: pointer; transition: transform .15s, background-color .15s; }
.btn:hover { transform: translateY(-2px); background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a0f08; }
.btn svg { width: 18px; height: 18px; }
.ip { align-self: flex-start; padding: 6px 12px; border-radius: 8px; border: 1px dashed var(--line); background: transparent; color: var(--muted); font: 600 14px var(--mono); cursor: pointer; }
.ip:hover { color: var(--fg); border-color: var(--accent); }
.podium { position: relative; z-index: 1; display: flex; align-items: flex-end; justify-content: center; gap: 0; padding: 0 14px; }
.pod { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; border: 0; padding: 0; background: none; color: var(--fg); cursor: pointer; }
.pod .skin { height: auto; margin: 0; }
.pod .skin img { width: 96px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.55)); transition: transform .2s; }
.pod:hover .skin img { transform: translateY(-6px); }
.pod.n1 .skin img { width: 124px; }
.pod b { display: grid; place-items: center; width: 100%; padding: 6px 0 10px; border-radius: 10px 10px 0 0; font: 900 20px var(--display); color: #120d08; }
.pod.n1 b { background: var(--gold); height: 74px; }
.pod.n2 b { background: var(--silver); height: 52px; }
.pod.n3 b { background: var(--bronze); height: 38px; }
.pod em { font: 600 12px var(--body); font-style: normal; color: var(--accent-2); margin-bottom: 4px; }
.pod span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 700 13px var(--body); margin-bottom: 4px; }
.side { display: flex; flex-direction: column; gap: 12px; }
.topcard { position: relative; overflow: hidden; display: block; width: 100%; height: 190px; padding: 14px; border: 1px solid var(--line); border-radius: 20px; background: linear-gradient(160deg, #23324a, #121a28); color: var(--fg); text-align: left; cursor: pointer; }
.topcard .label { position: relative; z-index: 1; color: var(--muted); font: 700 12px var(--body); letter-spacing: .12em; text-transform: uppercase; }
.topchip { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 10px; margin-top: 8px; padding: 6px 12px 6px 6px; border-radius: 12px; background: rgba(8,10,16,.75); }
.topchip img { width: 34px; height: 34px; object-fit: contain; }
.topchip .badge { font-size: 16px; }
.topchip span { font: 800 20px var(--body); max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topcard .skin { position: absolute; right: 6px; bottom: -70px; height: auto; margin: 0; }
.topcard .skin img { width: 150px; transform: rotate(-6deg); transition: transform .2s; }
.topcard:hover .skin img { transform: rotate(-2deg) translateY(-6px); }
.cta { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 14px; border-radius: 16px; background: var(--accent); color: #1a0f08; font: 900 16px var(--display); text-transform: uppercase; letter-spacing: .02em; text-decoration: none; transition: transform .15s; }
.cta:hover { transform: translateY(-2px); }
.comm { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 12px; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); }
.comm .ico { grid-row: span 2; width: 44px; height: 44px; border-radius: 12px; overflow: hidden; background: #5865f2; }
.comm .ico img { width: 100%; height: 100%; object-fit: cover; display: block; }
.comm h4 { margin: 0; font: 800 16px var(--body); }
.comm p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
.comm .btn { grid-column: 1 / -1; justify-content: center; margin-top: 8px; }
.khome { grid-column: 1 / -1; margin-top: 8px; }
.history { grid-column: 1 / -1; margin-top: 8px; }
.history h3 { margin: 0 0 12px; font: 900 22px var(--display); text-transform: uppercase; }
.card-b .history h3 { font-size: 16px; margin-top: 16px; }
.hbtn { margin-top: 16px; width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, .04); color: var(--fg); font: 700 15px var(--body); cursor: pointer; }
.hbtn span { padding: 1px 8px; border-radius: 999px; background: rgba(255, 255, 255, .1); font-size: 12px; }
.hbtn i { margin-left: auto; font-style: normal; opacity: .6; }
.hbtn:hover { border-color: rgba(255, 255, 255, .25); }
.hview { display: flex; flex-direction: column; max-height: calc(100vh - 64px); }
.hhead { display: flex; align-items: center; gap: 14px; padding: 18px 22px; border-bottom: 1px solid var(--line); }
.hhead h2 { margin: 0; font: 800 22px var(--body); }
.hhead span { color: var(--muted, #8a8f98); font-size: 14px; }
.hback { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .07); color: var(--fg); font-size: 18px; cursor: pointer; }
.hx { margin-left: auto; align-self: flex-start; border: 0; background: transparent; color: var(--muted, #8a8f98); font-size: 18px; cursor: pointer; }
.hview .hitems { overflow-y: auto; padding: 6px 22px 16px; }
.hitem { border-bottom: 1px solid var(--line); }
.hsum { list-style: none; display: flex; align-items: center; gap: 14px; padding: 14px 6px; }
details.hitem > summary { cursor: pointer; }
.hsum::-webkit-details-marker { display: none; }
.hitem .ki { width: 32px; height: 32px; image-rendering: pixelated; }
.hitem .kt { display: flex; flex-direction: column; line-height: 1.3; }
.hitem .kt b { font-size: 16px; }
.hitem .kt span { color: var(--muted, #8a8f98); font-size: 13px; }
.hitem .tr { margin-left: auto; font: 800 19px var(--body); }
.hitem .tr.gone { color: #ff6b6b; font-size: 15px; }
.chg .same { color: var(--muted, #8a8f98); font-size: 13px; margin-right: 6px; }
.hitem .chev, .hitem .nochev { width: 18px; flex: none; }
.hitem .chev::before { content: ""; display: block; width: 7px; height: 7px; margin: 0 auto 3px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); opacity: .6; transition: transform .2s; }
.hitem[open] .chev::before { transform: rotate(-135deg); margin-bottom: -3px; }
.hbody { padding: 0 6px 16px; }
.hbody .duels { color: var(--muted, #8a8f98); font-size: 13px; margin: 2px 0 10px; }
.hbody .against { display: flex; align-items: center; gap: 10px; color: var(--muted, #8a8f98); font-size: 13px; margin: 10px 0; }
.hbody .against::before, .hbody .against::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.hbody .duel { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.hbody .duel .hd { width: 26px; height: 26px; image-rendering: pixelated; border-radius: 4px; }
.hbody .sc { font: 900 18px var(--body); padding: 0 2px; }
.w { color: #5ee08a; }
.l { color: #ff6b6b; }
dialog { max-height: calc(100vh - 32px); overflow-y: auto; }
.hlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.hrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.hrow[data-name] { cursor: pointer; }
.hrow[data-name]:hover { border-color: rgba(255, 255, 255, .25); }
.hrow .when { color: var(--muted, #8a8f98); font-variant-numeric: tabular-nums; min-width: 92px; }
.hrow .who { display: flex; align-items: center; gap: 8px; font-weight: 700; min-width: 140px; }
.hrow .who img { width: 22px; height: 22px; image-rendering: pixelated; border-radius: 4px; }
.hrow .hk { display: flex; align-items: center; gap: 6px; min-width: 90px; }
.hrow .hk img { width: 20px; height: 20px; image-rendering: pixelated; }
.hrow .chg { display: flex; align-items: center; gap: 6px; }
.hrow .arr { font-style: normal; opacity: .6; }
.hrow .gone { color: #ff6b6b; font-weight: 700; }
.hrow .vs { margin-left: auto; color: var(--muted, #8a8f98); }
.hrow .vs b { color: var(--fg); }
.khome h3, .howto h3 { margin: 0 0 12px; font: 900 22px var(--display); text-transform: uppercase; }
/* как устроены тиры: полоса на каждую ступень, длина - доля от высшей */
.howto { grid-column: 1 / -1; margin-top: 18px; padding: 24px 26px; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); }
.howto p { margin: -4px 0 16px; color: var(--muted); }
.trow { display: grid; grid-template-columns: 64px minmax(0, 1fr) 90px; align-items: center; gap: 14px; padding: 5px 0; }
.trow b { font: 800 16px/1 var(--display); }
.trow .bar { height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.trow .bar i { display: block; height: 100%; border-radius: 99px; background: var(--c); transform-origin: left; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 50ms); }
.trow span { color: var(--muted); font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; }
@keyframes grow { from { transform: scaleX(0); } }
.kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ktile { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); border-left: 4px solid var(--k); border-radius: 14px; background: var(--panel); color: var(--fg); text-align: left; cursor: pointer; transition: transform .15s, background-color .15s; }
.ktile:hover { transform: translateY(-2px); background: var(--panel-2); }
.ktile img { width: 40px; height: 40px; object-fit: contain; }
.ktile b { display: block; font: 700 15px var(--body); }
.ktile span { color: var(--muted); font-size: 13px; }
@media (max-width: 1000px) {
  .home { grid-template-columns: minmax(0, 1fr); }
  .banner { grid-template-columns: minmax(0, 1fr); }
  .podium { padding-top: 10px; }
}

/* заголовок */
.hero { text-align: center; padding-block: 44px 20px; }
.hero h1 { margin: 0; font: 900 clamp(30px, 6vw, 62px)/1.15 var(--display); letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance; }
.hero p { margin: 14px auto 0; color: var(--muted); max-width: 56ch; font-size: 18px; }
.search { display: block; max-width: 440px; margin: 22px auto 0; }
.search input { width: 100%; background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); border-radius: 12px; color: var(--fg); font: 500 17px var(--body); padding: 12px 16px; }
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.sample { margin: 16px auto 0; display: inline-flex; gap: 8px; align-items: center; padding: 6px 14px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font: 600 14px var(--body); }

/* ---- общий рейтинг: плиты с игроком во весь рост, голова выше плиты */
.list { display: grid; gap: 12px; padding-top: 30px; }
.row { position: relative; display: grid; grid-template-columns: 150px 56px minmax(0, 1fr) auto; grid-template-rows: 124px; align-items: center; gap: 0 18px; padding-right: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
.row:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
/* блик пробегает по плите */
.row::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.10) 48%, rgba(255,255,255,.18) 50%, rgba(255,255,255,.10) 52%, transparent 65%) no-repeat; background-size: 250% 100%; background-position: 150% 0; }
.row:hover::after { animation: sweep 1.1s ease-out; }
/* у первых трёх: цвет места слева гаснет к киту, по нему медленно ходит свет */

  // буквы названия: # - точка. Ширина буквы - по строкам, между буквами одна пустая точка
  var GLYPHS = {

  // строка точками в SVG: [[текст, цвет], ...]; тень - те же точки на одну вниз-вправо, цвет/4
  function pixelText(parts) {
    var x = 0, front = "", back = "";
    parts.forEach(function (part) {
      var c = part[1], sh = "#" + c.slice(1).match(/../g).map(function (h) {
        return ("0" + Math.floor(parseInt(h, 16) / 4).toString(16)).slice(-2);
      }).join("");
      part[0].split("").forEach(function (ch) {
        var g = GLYPHS[ch];
        if (!g) { x += 4; return; }
        g.forEach(function (row, y) {
          for (var i = 0; i < row.length; i++) {
            if (row[i] !== "#") continue;
            back += '<rect x="' + (x + i + 1) + '" y="' + (y + 1) + '" width="1" height="1" fill="' + sh + '"/>';
            front += '<rect x="' + (x + i) + '" y="' + y + '" width="1" height="1" fill="' + c + '"/>';
          }
        });
        x += g[0].length + 1;
      });
    });
    return '<svg viewBox="0 0 ' + x + ' 8" shape-rendering="crispEdges" aria-hidden="true">' + back + front + "</svg>";
  }

  // аватарки Discord: в превью - картинками внутри страницы, на сайте - файлы рядом
  function avatar(kind) { return (window.DP_AVATARS || {})[kind] || (kind === "mark" ? "logo_mark.png" : "avatar_" + kind + ".png"); }

    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;

    if (b > 1 && b < 5) return few;
    return many;
  }

  var TROPHY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 2h12v2h4v4a5 5 0 0 1-4.6 5A6 6 0 0 1 13 16.9V19h4v3H7v-3h4v-2.1A6 6 0 0 1 6.6 13 5 5 0 0 1 2 8V4h4zm0 4H4v2a3 3 0 0 0 2 2.8zm12 0v4.8A3 3 0 0 0 20 8V6z"/></svg>';

  // кубок вкладки «Общий»: золото с бликом и звездой (TROPHY - простой, для заголовков)

    '<path d="M10.5 23h11l1.5 4.5H9z" fill="url(#cupg)"/><rect x="7.5" y="27" width="17" height="2.6" rx="1.2" fill="#8a4b12"/>' +
    '<path d="M16 5.8l1.35 2.75 3.05.45-2.2 2.15.5 3.05L16 12.75 13.3 14.2l.5-3.05-2.2-2.15 3.05-.45z" fill="#fff8dc"/>' +
    '<path d="M10.6 6v4.6a5.6 5.6 0 0 0 1.9 4.2" fill="none" stroke="#fff8dc" stroke-opacity=".75" stroke-width="1.2" stroke-linecap="round"/></svg>';
  var UP1 = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>';
  var UP2 = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 13 6-6 6 6M6 19l6-6 6 6"/></svg>';
  // у каждого кита свой оттенок плитки - по порядку китов
  var KIT_COLORS = ["#c2410c", "#b91c1c", "#a16207", "#65a30d", "#475569", "#ca8a04", "#15803d", "#0f766e", "#1d4ed8", "#7e22ce", "#be185d", "#0369a1"];

  // звание по сумме очков - как «Combat Master» у тестеров
  function rankTitle(points) {
    if (points >= 200) return "Легенда";
    if (points >= 120) return "Мастер боя";
    if (points >= 60) return "Ветеран";
    if (points >= 20) return "Боец";

  function tierOf(key) { return (DATA.tiers || []).find(function (t) { return t.key === key; }); }

  // значок кита: картинка из icons/ (её кладёт MakeSite.py) или встроенная в превью

  function badge(tierKey) {

  function chips(p) {

  }

  function matches(p) {

  function renderTabs() {

    DATA.kits.forEach(function (k) {
      var name = esc(k.name.replace(/^Kit\s+/i, ""));

  }
  function markTabs() {
    Array.prototype.forEach.call($("tabs").children, function (b) { b.setAttribute("aria-selected", String(b.dataset.tab === tab)); });
  }

  // игроки с тирами по месту - как в лидерборде
  function ranked() {
    var players = DATA.players.filter(function (p) { return p.points > 0; });
    players.sort(function (a, b) { return b.points - a.points || (b.wins || 0) - (a.wins || 0) || a.name.localeCompare(b.name); });
    return players;
  }

  // самый дорогой тир игрока и его кит - для карточки первого места
  function bestTier(p) {
    var best = null;
    DATA.kits.forEach(function (k) {
      var key = (p.tiers || {})[k.key];
      if (key && (!best || tierPoints(key) > best.pts)) best = { kit: k, key: key, pts: tierPoints(key) };
    });
    return best;
  }

  // как устроены тиры: ступени по очкам, от высшей; без очков (Restricted) и бывшие (R...) - не ступени
  function howto() {
    var list = (DATA.tiers || []).filter(function (t) { return t.points > 0 && !/^R/.test(t.key); })
      .sort(function (a, b) { return b.points - a.points; });
    if (!list.length) return "";
    var max = list[0].points;
    return '<section class="howto"><h3>Как устроены тиры</h3><p>Всего ' + list.length + " " + plural(list.length, "ступень", "ступени", "ступеней") +
      ": от " + esc(list[list.length - 1].key) + " внизу до " + esc(list[0].key) + " наверху. Чем выше ступень, тем больше за неё очков.</p>" +
      list.map(function (tr, i) {
        return '<div class="trow" style="--c:' + esc(tr.color || "#8a93a8") + ";--i:" + i + '"><b>' + esc(tr.key) + '</b><div class="bar"><i style="width:' +
          Math.max(3, Math.round(tr.points / max * 100)) + '%"></i></div><span>' + tr.points + " " + plural(tr.points, "очко", "очка", "очков") + "</span></div>";
      }).join("") + "</section>";
  }

  function renderHome() {
    var top = ranked();
    var p1 = top[0];
    var podium = [top[1], top[0], top[2]].map(function (p, i) {
      if (!p) return "";
      var n = [2, 1, 3][i];
      return '<button class="pod n' + n + '" data-name="' + esc(p.name) + '">' + skin(p) + "<span>" + esc(p.name) + "</span><em>" + p.points + " " +
        plural(p.points, "очко", "очка", "очков") + "</em><b>" + n + "</b></button>";
    }).join("");
    var best = p1 && bestTier(p1);
    var counts = {};
    DATA.players.forEach(function (p) { Object.keys(p.tiers || {}).forEach(function (k) { counts[k] = (counts[k] || 0) + 1; }); });
    return '<div class="home">' +
      '<section class="banner"><div class="banner-text">' +
        '<div class="kicker">Тир-лист сервера NoviMundi</div>' +
        '<h2 class="banner-title"><b>Novi</b>Mundi<br>Tiers</h2>' +
        "<p>Тестеры проверяют игроков в дуэлях на сервере и ставят тир в каждом ките — от LT5 до HT1. Сумма очков всех тиров — место в лидерборде.</p>" +
        '<div class="stats"><div><b>' + top.length + "</b><span>" + plural(top.length, "игрок", "игрока", "игроков") + " в рейтинге</span></div>" +
          "<div><b>" + DATA.kits.length + "</b><span>" + plural(DATA.kits.length, "кит", "кита", "китов") + " с тирами</span></div></div>" +
        '<button class="ip" id="ip" title="Скопировать адрес">' + esc(SERVER_IP) + "</button>" +
        '<div class="actions"><button class="btn primary" data-go="overall">' + TROPHY + "Лидерборд</button>" +
          '<a class="btn" href="' + DISCORD_TIERS + '" target="_blank" rel="noopener">' + DISCORD + "Подать заявку на тир</a></div>" +
      '</div><div class="podium">' + podium + "</div></section>" +
      '<aside class="side">' +
        (p1 ? '<button class="topcard" data-name="' + esc(p1.name) + '"><div class="label">Первое место</div>' +
          '<div class="topchip">' + (best ? '<img alt="" src="' + esc(iconSrc(best.kit)) + '">' + badge(best.key) : "") + "<span>" + esc(p1.name) + "</span></div>" + skin(p1) + "</button>" : "") +
        '<a class="cta" href="' + DISCORD_TIERS + '" target="_blank" rel="noopener">Подать заявку на тир →</a>' +
        '<div class="comm"><div class="ico"><img alt="" src="' + avatar("tiers") + '"></div>' + "<h4>NoviMundi Tiers</h4><p>Заявки на тест, апелляции и вопросы по тирам.</p>" +
          '<a class="btn" href="' + DISCORD_TIERS + '" target="_blank" rel="noopener">' + DISCORD + "Discord тиров</a></div>" +
        '<div class="comm"><div class="ico"><img alt="" src="' + avatar("main") + '"></div>' + "<h4>NoviMundi</h4><p>Основной сервер проекта: новости, ивенты и розыгрыши.</p>" +
          '<a class="btn" href="' + DISCORD_MAIN + '" target="_blank" rel="noopener">' + DISCORD + "Discord сервера</a></div>" +
      "</aside>" +
      howto() +
      historyBlock((DATA.history || []).slice(0, 15), true, "Последние тесты и тиры") +
      '<section class="khome"><h3>Тир-листы китов</h3><div class="kgrid">' +
        DATA.kits.map(function (k) {
          var n = counts[k.key] || 0;
          return '<button class="ktile" data-go="' + esc(k.key) + '" style="--k:' + kitColor(k) + '"><img alt="" src="' + esc(iconSrc(k)) + '"><div><b>' +
            esc(k.name.replace(/^Kit\s+/i, "")) + "</b><span>" + n + " " + plural(n, "игрок", "игрока", "игроков") + "</span></div></button>";
        }).join("") +
      "</div></section></div>";
  }

  function setTab(t) {
    tab = t;
    markTabs();
    try { localStorage.setItem("dp-tab", t); } catch (e) {}
    if (location.hash !== "#" + t) history.replaceState(null, "", "#" + t);
    render();
  }

  function renderOverall() {
    var players = DATA.players.filter(function (p) { return p.points > 0; });
    players.sort(function (a, b) { return b.points - a.points || (b.wins || 0) - (a.wins || 0) || a.name.localeCompare(b.name); });
    var out = [];
    players.forEach(function (p, i) {
      if (!matches(p)) return;
      out.push(
        '<div class="row' + (i < 3 ? " p" + (i + 1) : "") + '" style="--i:' + out.length + '" tabindex="0" data-name="' + esc(p.name) + '">' +
        skin(p) +
        '<div class="place">' + (i + 1) + "</div>" +
        '<div class="who"><div class="name">' + esc(p.name) + '</div><div class="pts"><b>' + p.points + "</b> " + plural(p.points, "очко", "очка", "очков") + " · " + rankTitle(p.points) + "</div></div>" +
        '<div class="tiers">' + chips(p) + "</div></div>"
      );
    });
    $("title").textContent = "Лидерборд";
    $("lead").textContent = "Рейтинг игроков по сумме очков тиров во всех китах. Тиры выдают тестеры по дуэлям на сервере.";
    return out.length ? '<div class="list">' + out.join("") + "</div>" : "";
  }

  // тир-лист кита: колонки «Тир 1»…«Тир 5», в колонке сначала HT, потом LT, бывшие (R) - в конце;
  // шестая - Restricted: тир без цифры, после LT5
  function renderKit() {
    var kit = DATA.kits.find(function (k) { return k.key === tab; });
    var cols = [[], [], [], [], [], []];
    var total = 0;
    DATA.players.forEach(function (p) {
      var key = (p.tiers || {})[tab];
      if (!key) return;
      var n = /^restricted$/i.test(key) ? 6 : +(key.match(/\d/) || [0])[0];
      if (!n || n > 6) return;
      total++;
      if (matches(p)) cols[n - 1].push(p);
    });
    function rank(p) {
      var key = p.tiers[tab];
      return (/^R/.test(key) ? 2 : 0) + (/HT/.test(key) ? 0 : 1);
    }
    var html = cols.map(function (list, i) {
      list.sort(function (a, b) {
        return rank(a) - rank(b) || ((b.elo || {})[tab] || 0) - ((a.elo || {})[tab] || 0) || a.name.localeCompare(b.name);
      });
      var items = list.map(function (p) {
        var key = p.tiers[tab];
        var ht = /HT/.test(key);
        return '<button class="tp' + (ht ? " ht" : "") + (/^R/.test(key) ? " retired" : "") + '" data-name="' + esc(p.name) + '" title="' + esc(key) + '">' +
          '<img alt="" src="' + esc(headSrc(p)) + '"><span>' + esc(p.name) + "</span>" + (/^restricted$/i.test(key) ? "" : ht ? UP2 : UP1) + "</button>";
      }).join("");
      if (i === 5) {
        return '<section class="tcol tr" style="--i:' + i + '"><h3>Restricted</h3>' + '<div class="tps">' + (items || '<div class="tnone">—</div>') + "</div></section>";
      }
      return '<section class="tcol t' + (i + 1) + '" style="--i:' + i + '"><h3>' + TROPHY + "Тир " + (i + 1) + "</h3>" +
        '<div class="tps">' + (items || '<div class="tnone">—</div>') + "</div></section>";
    }).join("");
    var name = kit ? kit.name : tab;
    $("title").textContent = "Тир-лист " + name;
    $("lead").textContent = "Игроков в рейтинге: " + total + ", от HT1 до LT5. Нажми на игрока - его карточка.";
    return total ? '<div class="tierlist">' + html + "</div>" : "";
  }

  function render() {
    $("hero").hidden = tab === "home";
    if (tab === "home") {
      $("list").innerHTML = renderHome();
      Array.prototype.forEach.call($("list").querySelectorAll("[data-go]"), function (b) {
        b.addEventListener("click", function () { setTab(b.dataset.go); window.scrollTo(0, 0); });
      });
      Array.prototype.forEach.call($("list").querySelectorAll("[data-name]"), function (r) {
        r.addEventListener("click", function () { openCard(r.dataset.name); });
      });
      $("ip").addEventListener("click", function () {
        var b = this;
        try { navigator.clipboard.writeText(SERVER_IP).then(function () { b.textContent = "Скопировано"; setTimeout(function () { b.textContent = SERVER_IP; }, 1500); }); } catch (e) {}
      });
      return;
    }
    var html = tab === "overall" ? renderOverall() : renderKit();
    $("list").innerHTML = html ||
      '<div class="empty-state">' + ($("q").value.trim() ? "Никого с таким ником." : "Тиров пока нет. Тестер выдаёт их командой /tier set на сервере.") + "</div>";
    Array.prototype.forEach.call($("list").querySelectorAll("[data-name]"), function (r) {
      r.addEventListener("click", function () { openCard(r.dataset.name); });
      r.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openCard(r.dataset.name); } });
    });
  }

  // ---- история тиров
  function kitByKey(key) { return DATA.kits.find(function (k) { return k.key === key; }); }
  function historyRow(e, withName) {
    var k = kitByKey(e.kit);
    // перетест: тот же тир со счётом - «подтверждён LT3»
    var same = e.tier && (e.retest || e.before === e.tier);
    var change = same ? '<span class="same">подтверждён</span>' + badge(e.tier)
      : e.tier ? (e.before ? badge(e.before) + '<i class="arr">→</i>' : "") + badge(e.tier)
      : badge(e.before) + '<i class="arr">→</i><span class="gone">снят</span>';
    var test = e.tester ? '<span class="vs"><b>' + esc(e.tester) + '</b> <b class="' + (e.ts > e.ps ? "w" : "l") + '">' + e.ts +
      '</b>:<b class="' + (e.ps > e.ts ? "w" : "l") + '">' + e.ps + "</b> " + esc(e.name) + "</span>" : "";
    return '<li class="hrow"' + (withName ? ' data-name="' + esc(e.name) + '" tabindex="0"' : "") + ">" +
      '<span class="when">' + esc(e.t.slice(8, 10) + "." + e.t.slice(5, 7) + " " + e.t.slice(11)) + "</span>" +
      (withName ? '<span class="who">' + '<img alt="" src="' + esc(headSrc(DATA.players.find(function (p) { return p.name === e.name; }) || { name: e.name })) + '">' + esc(e.name) + "</span>" : "") +
      (k ? '<span class="hk"><img alt="" src="' + esc(iconSrc(k)) + '">' + esc(k.name.replace(/^Kit\s+/i, "")) + "</span>" : "") +
      '<span class="chg">' + change + "</span>" + test + "</li>";
  }
  function historyBlock(list, withName, title) {
    if (!list.length) return "";
    return '<section class="history"><h3>' + title + '</h3><ul class="hlist">' + list.map(function (e) { return historyRow(e, withName); }).join("") + "</ul></section>";
  }

  // история тиров - отдельным окном из карточки игрока: запись с боями
  // раскрывается стрелкой справа, в ней поединки и счёт
  var MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  function longDate(t) {
    return +t.slice(8, 10) + " " + MONTHS[+t.slice(5, 7) - 1] + " " + t.slice(0, 4) + " г. в " + t.slice(11, 16);
  }
  function tierFull(key) {
    if (!key) return "";
    var m = /^(H|L)T(\d)$/.exec(key);
    return m ? (m[1] === "H" ? "High" : "Low") + " Tier " + m[2] : key;
  }
  function headOf(name) {
    var p = DATA.players.find(function (x) { return x.name === name; }) || { name: name };
    return '<img class="hd" alt="" src="' + esc(headSrc(p)) + '">';
  }
  function duelsOf(e) {
    if (e.duels) return e.duels;
    return e.tester ? [{ opp: e.tester, ps: e.ps, os: e.ts }] : [];
  }
  function historyItem(e) {
    var k = kitByKey(e.kit);
    var duels = duelsOf(e);
    var head = (k ? '<img class="ki" alt="" src="' + esc(iconSrc(k)) + '">' : "") +
      '<span class="kt"><b>' + esc(k ? k.name.replace(/^Kit\s+/i, "") : e.kit) + "</b><span>" + esc(longDate(e.t)) +
      (e.tier && (e.retest || e.before === e.tier) ? " · подтверждён" : "") + "</span></span>" +
      '<span class="tr' + (e.tier ? "" : " gone") + '">' + esc(e.tier || "снят") + "</span>";
    if (!duels.length) return '<div class="hitem"><div class="hsum">' + head + '<i class="nochev"></i></div></div>';
    var body = '<div class="duels">Поединки (' + duels.length + ")</div>" + duels.map(function (d) {
      var op = DATA.players.find(function (x) { return x.name === d.opp; });
      var ot = op && (op.tiers || {})[e.kit];
      return '<div class="against"><span>' + (ot ? "Против " + esc(tierFull(ot)) : "Вне тирлиста") + "</span></div>" +
        '<div class="duel">' + headOf(e.name) + "<b>" + esc(e.name) + "</b>" +
        '<span class="sc"><b class="' + (d.ps > d.os ? "w" : "l") + '">' + d.ps + '</b> : <b class="' + (d.os > d.ps ? "w" : "l") + '">' + d.os + "</b></span>" +
        "<b>" + esc(d.opp) + "</b>" + headOf(d.opp) + "</div>";
    }).join("");
    return '<details class="hitem"><summary class="hsum">' + head + '<i class="chev" aria-hidden="true"></i></summary><div class="hbody">' + body + "</div></details>";
  }
  function openHistory(p) {
    var list = (DATA.history || []).filter(function (e) { return e.name === p.name; });
    $("card").innerHTML =
      '<div class="hview"><div class="hhead"><button class="hback" id="hback" aria-label="Назад">←</button>' +
      '<div><h2 id="card-name">История тиров</h2><span>' + esc(p.name) + '</span></div><button class="hx" id="hx" aria-label="Закрыть">✕</button></div>' +
      '<div class="hitems">' + list.map(historyItem).join("") + "</div></div>";
    $("hback").addEventListener("click", function () { openCard(p.name); });
    $("hx").addEventListener("click", function () { $("card").close(); });
  }

  function openCard(name) {
    var p = DATA.players.find(function (x) { return x.name === name; });
    if (!p) return;
    var kd = (p.deaths || 0) ? ((p.kills || 0) / p.deaths).toFixed(2) : String(p.kills || 0);
    var rows = DATA.kits.map(function (k) {
      var s = (p.kits || {})[k.key] || {};
      return "<tr><td><span class=\"kit-name\"><img alt=\"\" src=\"" + esc(iconSrc(k)) + "\">" + esc(k.name) + "</span></td><td>" + badge((p.tiers || {})[k.key]) +
        '</td><td class="num">' + ((p.elo || {})[k.key] || "—") + '</td><td class="num">' + (s.wins || 0) + "/" + (s.losses || 0) + "</td></tr>";
    }).join("");
    $("card").innerHTML =
      '<div class="card-h">' + skin(p) + '<div><h2 id="card-name">' + esc(p.name) + '</h2><div class="pts"><b>' + p.points + "</b> " + plural(p.points, "очко", "очка", "очков") + " · " + rankTitle(p.points) + '</div></div><button class="close" id="close">Закрыть</button></div>' +
      '<div class="card-b"><div class="totals">' +
      '<div class="tot"><b>' + (p.wins || 0) + "</b><span>Победы</span></div>" +
      '<div class="tot"><b>' + (p.losses || 0) + "</b><span>Поражения</span></div>" +
      '<div class="tot"><b>' + kd + "</b><span>У/С</span></div>" +
      '<div class="tot"><b>' + (p.bestStreak || 0) + "</b><span>Серия</span></div></div>" +
      '<div style="overflow-x:auto"><table class="kit-table"><thead><tr><th>Кит</th><th>Тир</th><th>ELO</th><th>Победы</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
      ((DATA.history || []).some(function (e) { return e.name === p.name; })
        ? '<button class="hbtn" id="hopen">История тиров <span>' + (DATA.history || []).filter(function (e) { return e.name === p.name; }).length + '</span><i>→</i></button>' : "") + "</div>";
    $("close").addEventListener("click", function () { $("card").close(); });
    if ($("hopen")) $("hopen").addEventListener("click", function () { openHistory(p); });
    $("card").showModal();
  }

  function start(data, sample) {
    DATA = data;
    DATA.kits = DATA.kits || [];
    DATA.players = DATA.players || [];
    $("sample").hidden = !sample;
    // без вкладки в адресе - главная
    var wanted = (location.hash || "").slice(1);
    if (wanted === "overall" || wanted === "home" || DATA.kits.some(function (k) { return k.key === wanted; })) tab = wanted;
    renderTabs();
    $("mark").style.setProperty("--mark", 'url("' + avatar("mark") + '")');
    $("mc-title").innerHTML = pixelText([["Novi", "#ffaa00"], ["Mundi", "#ffffff"]]);
    $("mc-splash").innerHTML = pixelText([["Tiers!", "#ffff55"]]);
    $("logo").addEventListener("click", function (e) { e.preventDefault(); setTab("home"); window.scrollTo(0, 0); });
    render();
    var when = DATA.generated ? new Date(DATA.generated) : null;
    $("foot").textContent = (DATA.server || "NoviMundi") + " · игроков в рейтинге: " + DATA.players.filter(function (p) { return p.points > 0; }).length +
      (when && !isNaN(when) ? " · обновлено " + when.toLocaleString("ru-RU") : "");
  }

  // скин не загрузился - скин с вопросиком;
  // значок не загрузился - место остаётся пустым, без значка битой картинки
  document.addEventListener("error", function (e) {
    var img = e.target;
    if (!img || img.tagName !== "IMG") return;
    if (!img.dataset.unknown && img.closest(".skin, .tp")) {
      // скин не нашёлся - скин с вопросиком (в превью он внутри страницы)
      img.dataset.unknown = "1";
      var kind = img.closest(".tp") ? "head" : "full";
      img.src = (window.DP_UNKNOWN || {})[kind] || ("unknown_" + kind + ".png");
      return;
    }
    img.style.visibility = "hidden";
  }, true);
  $("q").addEventListener("input", render);
  $("card").addEventListener("click", function (e) { if (e.target === $("card")) $("card").close(); });

  if (window.DP_SAMPLE) {
    start(window.DP_SAMPLE, true);
  } else if (window.DP_DATA) {
    start(window.DP_DATA, false);
  } else {
    fetch("data.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { start(d, false); })
      .catch(function () {
        $("list").innerHTML = '<div class="empty-state">Не нашёл data.json рядом со страницей. Его выгружает плагин в plugins/DuelPractice/web/data.json - положите файл рядом с index.html.</div>';
      });
  }
})();
</script>

</body>
</html>
